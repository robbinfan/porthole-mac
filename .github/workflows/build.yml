name: Build DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build DMG
        run: scripts/build-dmg.sh "${GITHUB_REF_NAME:-dev}"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: porthole-cmux-dmg
          path: build/*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
